<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Météo du Passé 🌤️</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .container {
            background: rgba(255, 255, 255, 0.95);
            border-radius: 30px;
            padding: 40px;
            max-width: 800px;
            width: 100%;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            animation: fadeIn 0.5s ease-in;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(-20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        h1 {
            text-align: center;
            color: #667eea;
            margin-bottom: 10px;
            font-size: 2.5em;
        }

        .subtitle {
            text-align: center;
            color: #666;
            margin-bottom: 30px;
            font-size: 1.1em;
        }

        .form-group {
            margin-bottom: 25px;
        }

        label {
            display: block;
            margin-bottom: 8px;
            color: #333;
            font-weight: 600;
            font-size: 1.1em;
        }

        input, select {
            width: 100%;
            padding: 15px;
            border: 2px solid #e0e0e0;
            border-radius: 12px;
            font-size: 1em;
            transition: all 0.3s ease;
            background: white;
        }

        input:focus, select:focus {
            outline: none;
            border-color: #667eea;
            box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.1);
        }

        button {
            width: 100%;
            padding: 18px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            border-radius: 12px;
            font-size: 1.2em;
            font-weight: 600;
            cursor: pointer;
            transition: transform 0.2s ease, box-shadow 0.2s ease;
            margin-top: 10px;
        }

        button:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 25px rgba(102, 126, 234, 0.4);
        }

        button:active {
            transform: translateY(0);
        }

        .weather-result {
            display: none;
            margin-top: 30px;
            animation: slideUp 0.5s ease-out;
        }

        @keyframes slideUp {
            from {
                opacity: 0;
                transform: translateY(30px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .weather-header {
            text-align: center;
            padding: 25px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            border-radius: 15px;
            color: white;
            margin-bottom: 20px;
        }

        .weather-icon {
            font-size: 4em;
            margin-bottom: 10px;
        }

        .date-display {
            font-size: 1.3em;
            margin-bottom: 5px;
        }

        .location {
            font-size: 1.8em;
            font-weight: 600;
            margin-bottom: 10px;
        }

        .temperature-main {
            font-size: 3.5em;
            font-weight: bold;
        }

        .weather-info-list {
            margin-top: 20px;
        }

        .weather-info-item {
            background: linear-gradient(135deg, #f5f7fa 0%, #c3cfe2 100%);
            padding: 20px;
            border-radius: 15px;
            margin-bottom: 12px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            transition: transform 0.2s ease;
        }

        .weather-info-item:hover {
            transform: translateX(5px);
        }

        .weather-info-left {
            display: flex;
            align-items: center;
            gap: 15px;
        }

        .weather-info-icon {
            font-size: 2em;
        }

        .weather-info-label {
            color: #666;
            font-size: 1em;
        }

        .weather-info-value {
            color: #333;
            font-size: 1.5em;
            font-weight: 600;
        }

        .back-button {
            background: linear-gradient(135deg, #f093fb 0%, #f5576c 100%);
            margin-top: 20px;
            padding: 12px;
            font-size: 1em;
        }

        @media (max-width: 600px) {
            .container {
                padding: 25px;
            }

            h1 {
                font-size: 2em;
            }

            .weather-info-item {
                flex-direction: column;
                text-align: center;
                gap: 10px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div id="formSection">
            <h1>🌤️ Météo du Passé</h1>
            <p class="subtitle">Découvrez le temps qu'il faisait à une date particulière</p>
            
            <form id="weatherForm">
                <div class="form-group">
                    <label for="day">📅 Jour</label>
                    <select id="day" required>
                        <option value="">Choisissez un jour</option>
                    </select>
                </div>

                <div class="form-group">
                    <label for="month">📆 Mois</label>
                    <select id="month" required>
                        <option value="">Choisissez un mois</option>
                        <option value="1">Janvier</option>
                        <option value="2">Février</option>
                        <option value="3">Mars</option>
                        <option value="4">Avril</option>
                        <option value="5">Mai</option>
                        <option value="6">Juin</option>
                        <option value="7">Juillet</option>
                        <option value="8">Août</option>
                        <option value="9">Septembre</option>
                        <option value="10">Octobre</option>
                        <option value="11">Novembre</option>
                        <option value="12">Décembre</option>
                    </select>
                </div>

                <div class="form-group">
                    <label for="year">🗓️ Année</label>
                    <input type="number" id="year" min="1900" max="2024" required placeholder="Ex: 1990">
                </div>

                <div class="form-group">
                    <label for="city">🏙️ Ville</label>
                    <input type="text" id="city" required placeholder="Ex: Paris">
                </div>

                <button type="submit">✨ Découvrir la météo</button>
            </form>
        </div>

        <div id="weatherResult" class="weather-result">
            <div class="weather-header">
                <div class="weather-icon" id="mainIcon">🌤️</div>
                <div class="date-display" id="dateDisplay"></div>
                <div class="location" id="locationDisplay"></div>
                <div class="temperature-main" id="temperatureMain"></div>
                <div id="weatherDescription"></div>
            </div>

            <div class="weather-info-list" id="weatherInfoList">
                <!-- Les informations seront insérées ici dynamiquement -->
            </div>

            <button class="back-button" onclick="goBack()">🔙 Nouvelle recherche</button>
        </div>
    </div>

    <script>
        // Remplir les jours
        const daySelect = document.getElementById('day');
        for (let i = 1; i <= 31; i++) {
            const option = document.createElement('option');
            option.value = i;
            option.textContent = i;
            daySelect.appendChild(option);
        }

        // Définition des types d'informations pour le codage
        const monthInfoTypes = [
            { id: 'temperature', icon: '🌡️', label: 'Température', unit: '°C', position: 1 },
            { id: 'feelsLike', icon: '🌡️', label: 'Température ressentie', unit: '°C', position: 2 },
            { id: 'humidity', icon: '💧', label: 'Taux d\'humidité', unit: '%', position: 3 },
            { id: 'wind', icon: '💨', label: 'Vitesse du vent', unit: 'km/h', position: 4 },
            { id: 'precipitation', icon: '☔', label: 'Précipitations', unit: 'mm', position: 5 },
            { id: 'pressure', icon: '🔽', label: 'Pression atmosphérique', unit: 'hPa', position: 6 }
        ];

        const dayInfoTypes = [
            { id: 'uv', icon: '☀️', label: 'Indice UV', unit: '', position: 1 },
            { id: 'sunrise', icon: '🌅', label: 'Lever du soleil', unit: '', position: 2 },
            { id: 'sunset', icon: '🌇', label: 'Coucher du soleil', unit: '', position: 3 },
            { id: 'rain', icon: '🌧️', label: 'Pluie', unit: 'mm', position: 4 },
            { id: 'visibility', icon: '👁️', label: 'Visibilité', unit: 'km', position: 5 },
            { id: 'airQuality', icon: '🍃', label: 'Qualité de l\'air', unit: '', position: 6 },
            { id: 'moon', icon: '🌙', label: 'Phase lunaire', unit: '', position: 7 },
            { id: 'cloudCover', icon: '☁️', label: 'Couverture nuageuse', unit: '%', position: 8 }
        ];

        function generateWeather(day, month, year, city) {
            const seed = city.length + day + month * 100 + (year % 100);
            
            function seededRandom(min, max, offset = 0) {
                const x = Math.sin(seed + offset) * 10000;
                return Math.floor((x - Math.floor(x)) * (max - min + 1)) + min;
            }

            // Températures selon la saison
            let baseTemp;
            if (month >= 12 || month <= 2) {
                baseTemp = seededRandom(-5, 8);
            } else if (month >= 3 && month <= 5) {
                baseTemp = seededRandom(10, 20);
            } else if (month >= 6 && month <= 8) {
                baseTemp = seededRandom(20, 35);
            } else {
                baseTemp = seededRandom(8, 18);
            }

            const conditions = [
                { icon: '☀️', desc: 'Ensoleillé' },
                { icon: '⛅', desc: 'Partiellement nuageux' },
                { icon: '☁️', desc: 'Nuageux' },
                { icon: '🌧️', desc: 'Pluie' },
                { icon: '⛈️', desc: 'Orageux' },
                { icon: '🌤️', desc: 'Éclaircies' }
            ];

            const conditionIndex = seededRandom(0, conditions.length - 1, 100);
            const condition = conditions[conditionIndex];

            if (baseTemp < 2 && (month >= 12 || month <= 2)) {
                if (seededRandom(0, 1, 200) === 1) {
                    condition.icon = '❄️';
                    condition.desc = 'Neige';
                }
            }

            // Calcul de l'heure de lever/coucher du soleil
            const sunriseHour = 6 + Math.floor((month - 1) / 2);
            const sunriseMinute = seededRandom(0, 59, 400);
            const sunsetHour = 18 + Math.floor((6 - month) / 2);
            const sunsetMinute = seededRandom(0, 59, 500);

            // Phase lunaire
            const moonPhases = ['🌑 Nouvelle lune', '🌒 Premier croissant', '🌓 Premier quartier', '🌔 Gibbeuse croissante', 
                              '🌕 Pleine lune', '🌖 Gibbeuse décroissante', '🌗 Dernier quartier', '🌘 Dernier croissant'];
            const moonPhase = moonPhases[seededRandom(0, 7, 600)];

            // Qualité de l'air
            const airQualities = ['Excellente', 'Bonne', 'Moyenne', 'Médiocre', 'Mauvaise'];
            const airQuality = airQualities[seededRandom(0, 4, 700)];

            return {
                temperature: baseTemp,
                feelsLike: baseTemp + seededRandom(-3, 3, 150),
                wind: seededRandom(5, 40, 250),
                humidity: seededRandom(30, 90, 300),
                precipitation: seededRandom(0, 30, 350),
                pressure: seededRandom(980, 1030, 450),
                uv: seededRandom(1, 11, 500),
                sunrise: `${sunriseHour.toString().padStart(2, '0')}:${sunriseMinute.toString().padStart(2, '0')}`,
                sunset: `${sunsetHour.toString().padStart(2, '0')}:${sunsetMinute.toString().padStart(2, '0')}`,
                rain: seededRandom(0, 25, 550),
                visibility: seededRandom(2, 20, 600),
                airQuality: airQuality,
                moon: moonPhase,
                cloudCover: seededRandom(0, 100, 650),
                icon: condition.icon,
                description: condition.desc
            };
        }

        function determineInfoOrder(day, month, year) {
            // Déterminer quelle info pour le mois doit être en position 1 ou 2
            let monthInfoPosition;
            let monthInfoIndex;
            
            if (month <= 6) {
                // Mois 1-6 : en position 1
                monthInfoPosition = 0;
                monthInfoIndex = month - 1;
            } else {
                // Mois 7-12 : en position 2 (indices 0,1,2,3,4,5 correspondent à mois 7,8,9,10,11,12)
                monthInfoPosition = 1;
                monthInfoIndex = (month / 2) - 1;
                // Mois 8 -> index 3, mois 10 -> index 4, mois 12 -> index 5
                // Mois 7 -> 3.5 -> 2.5 -> 2 (arrondi)
                monthInfoIndex = Math.floor(month / 2) - 1;
            }

            // Déterminer le suffixe selon la tranche du jour
            let suffix = '';
            if (day >= 1 && day <= 8) suffix = '';
            else if (day >= 9 && day <= 16) suffix = ' minimal';
            else if (day >= 17 && day <= 24) suffix = ' moyen';
            else if (day >= 25 && day <= 31) suffix = ' maximal';

            // Déterminer quelle info secondaire pour le jour précis
            let dayInfoIndex;
            if (month <= 6) {
                // 1ère moitié : utiliser la 1ère info secondaire
                dayInfoIndex = ((day - 1) % 8);
            } else {
                // 2ème moitié : utiliser la 2ème info secondaire
                dayInfoIndex = ((day - 1) % 8);
            }

            return {
                monthInfoIndex,
                monthInfoPosition,
                suffix,
                dayInfoIndex,
                useFirstDayInfo: month <= 6
            };
        }

        document.getElementById('weatherForm').addEventListener('submit', function(e) {
            e.preventDefault();

            const day = parseInt(document.getElementById('day').value);
            const month = parseInt(document.getElementById('month').value);
            const year = parseInt(document.getElementById('year').value);
            const city = document.getElementById('city').value;

            const weather = generateWeather(day, month, year, city);
            const orderInfo = determineInfoOrder(day, month, year);

            // Formater la date
            const monthNames = ['Janvier', 'Février', 'Mars', 'Avril', 'Mai', 'Juin', 
                              'Juillet', 'Août', 'Septembre', 'Octobre', 'Novembre', 'Décembre'];
            const dateString = `${day} ${monthNames[month - 1]} ${year}`;

            // Afficher l'en-tête
            document.getElementById('mainIcon').textContent = weather.icon;
            document.getElementById('dateDisplay').textContent = dateString;
            document.getElementById('locationDisplay').textContent = city;
            document.getElementById('temperatureMain').textContent = `${weather.temperature}°C`;
            document.getElementById('weatherDescription').textContent = weather.description;

            // Créer la liste ordonnée des informations
            const infoList = document.getElementById('weatherInfoList');
            infoList.innerHTML = '';

            // Créer un tableau pour ordonner les infos
            let orderedInfos = [];

            // Ajouter les infos de mois
            monthInfoTypes.forEach((info, index) => {
                let label = info.label;
                let value = weather[info.id];
                
                // Ajouter le suffixe si c'est l'info qui code le mois
                if (index === orderInfo.monthInfoIndex) {
                    label += orderInfo.suffix;
                }
                
                let position = index === orderInfo.monthInfoIndex ? orderInfo.monthInfoPosition : 
                              (index < orderInfo.monthInfoIndex || (orderInfo.monthInfoPosition === 1 && index === 0)) ? 
                              index + 2 : index + 2 + (orderInfo.monthInfoPosition === 0 ? 1 : 0);
                
                orderedInfos.push({
                    position: position,
                    icon: info.icon,
                    label: label,
                    value: value + info.unit
                });
            });

            // Ajouter les infos du jour
            dayInfoTypes.forEach((info, index) => {
                let value;
                switch(info.id) {
                    case 'uv': value = weather.uv; break;
                    case 'sunrise': value = weather.sunrise; break;
                    case 'sunset': value = weather.sunset; break;
                    case 'rain': value = weather.rain + info.unit; break;
                    case 'visibility': value = weather.visibility + info.unit; break;
                    case 'airQuality': value = weather.airQuality; break;
                    case 'moon': value = weather.moon; break;
                    case 'cloudCover': value = weather.cloudCover + info.unit; break;
                }
                
                // Déterminer la position selon si on utilise la 1ère ou 2ème info
                let basePosition = 8;
                let offset = index;
                
                // L'info qui code est mise à une position spécifique
                if (index === orderInfo.dayInfoIndex) {
                    if (orderInfo.useFirstDayInfo) {
                        // 1ère info secondaire : juste après les infos de mois
                        offset = -6;
                    } else {
                        // 2ème info secondaire : position 7 (après la 1ère info secondaire)
                        offset = -5;
                    }
                }
                
                orderedInfos.push({
                    position: basePosition + offset,
                    icon: info.icon,
                    label: info.label,
                    value: value
                });
            });

            // Trier et afficher
            orderedInfos.sort((a, b) => a.position - b.position);

            orderedInfos.forEach(info => {
                const item = document.createElement('div');
                item.className = 'weather-info-item';
                item.innerHTML = `
                    <div class="weather-info-left">
                        <div class="weather-info-icon">${info.icon}</div>
                        <div class="weather-info-label">${info.label}</div>
                    </div>
                    <div class="weather-info-value">${info.value}</div>
                `;
                infoList.appendChild(item);
            });

            // Cacher le formulaire et afficher les résultats
            document.getElementById('formSection').style.display = 'none';
            document.getElementById('weatherResult').style.display = 'block';
        });

        function goBack() {
            document.getElementById('formSection').style.display = 'block';
            document.getElementById('weatherResult').style.display = 'none';
        }
    </script>
</body>
</html>
